name = "southyai-studios-mvp"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "southyai-studios-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "southyai-studios-private"

# Free AI (Cloudflare Workers AI) used for the English voice engine
[ai]
binding = "AI"

[vars]
# Languages switched on in the voice tool. Add "af", "zu" etc. only after you've tested the engine for that language.
ENABLED_LANGS = "en"
# Free credits a new account gets. Keep at 0 until you have abuse protection.
SIGNUP_CREDITS = "0"
